[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "harvestguard-pk"
version = "0.1.0"
description = "Leakage-safe district-crop yield shock forecasting benchmark for Pakistan"
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
authors = [{name = "Masmatix Innovations Research"}]
keywords = ["Pakistan", "agriculture", "crop-yield", "food-security", "machine-learning", "conformal-prediction"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.optional-dependencies]
data = ["duckdb>=1.1,<2"]

[project.scripts]
harvestguard = "harvestguard_pk.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
